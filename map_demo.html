<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Global Map — 3 Options Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#050D1A;color:white;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
h1{font-size:1.8rem;font-weight:800;margin-bottom:0.5rem;background:linear-gradient(135deg,#00AEEF,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center}
p.sub{color:rgba(255,255,255,0.4);font-size:0.9rem;text-align:center;margin-bottom:2rem}

/* TABS */
.tabs{display:flex;gap:0.75rem;margin-bottom:2rem;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:6px}
.tab{padding:0.6rem 1.5rem;border-radius:10px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;font-size:0.875rem;font-weight:600;color:rgba(255,255,255,0.45);background:transparent;transition:all 0.3s}
.tab.active{background:linear-gradient(135deg,#00AEEF,#7C3AED);color:white;box-shadow:0 4px 20px rgba(0,174,239,0.3)}

/* DEMO AREAS */
.demo{width:100%;max-width:960px;height:460px;border-radius:20px;overflow:hidden;border:1px solid rgba(0,174,239,0.12);position:relative;background:#050D1A;display:none}
.demo.active{display:block}
canvas{width:100%!important;height:100%!important}

/* LABEL */
.badge{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);background:rgba(0,174,239,0.1);border:1px solid rgba(0,174,239,0.2);padding:0.4rem 1.2rem;border-radius:50px;font-size:0.78rem;color:#00AEEF;font-weight:600;white-space:nowrap;z-index:10}

/* SVG MAP STYLES */
#map-b{background:linear-gradient(180deg,#060e20 0%,#0a1628 100%)}
#map-b svg{width:100%;height:100%}
.country{fill:#1a2a3a;transition:fill 0.3s}
.country.active{fill:#00AEEF;opacity:0.85}
.country.active2{fill:#1a6fa0;opacity:0.75}

/* MAP PINS */
.pin-wrap{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:20}
.pin{width:34px;height:34px;background:linear-gradient(135deg,#00AEEF,#7C3AED);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,174,239,0.5);animation:pin-bounce 2s ease-in-out infinite}
.pin-inner{width:14px;height:14px;background:white;border-radius:50%;transform:rotate(45deg)}
@keyframes pin-bounce{0%,100%{transform:rotate(-45deg) translateY(0)}50%{transform:rotate(-45deg) translateY(-6px)}}
.pin-pulse{position:absolute;width:50px;height:50px;border-radius:50%;border:2px solid rgba(0,174,239,0.4);animation:pulse-ring 2s ease-out infinite;top:50%;left:50%;transform:translate(-50%,-50%)}
.pin-pulse2{animation-delay:0.6s;opacity:0.5}
@keyframes pulse-ring{0%{transform:translate(-50%,-50%) scale(0.8);opacity:1}100%{transform:translate(-50%,-50%) scale(2);opacity:0}}
.pin-label{margin-top:8px;background:rgba(5,13,26,0.9);border:1px solid rgba(0,174,239,0.3);padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:600;color:#00AEEF;white-space:nowrap}

/* OPTION C: dot globe */
#map-c canvas{display:block}

/* LEGEND */
.legend{position:absolute;bottom:1rem;left:1rem;display:flex;gap:1rem;z-index:10}
.leg-item{display:flex;align-items:center;gap:6px;font-size:0.72rem;color:rgba(255,255,255,0.5)}
.leg-dot{width:10px;height:10px;border-radius:50%}
</style>
</head>
<body>

<h1>🌍 Global Section — 3 Options</h1>
<p class="sub">اختار الستايل اللي يعجبك — وهنضيفه جوا الصفحة</p>

<div class="tabs">
  <button class="tab active" onclick="showTab('a',this)">🌐 Option A — 3D Globe</button>
  <button class="tab" onclick="showTab('b',this)">🗺️ Option B — SVG Map (زي الصورة)</button>
  <button class="tab" onclick="showTab('c',this)">✨ Option C — Dot Globe</button>
</div>

<!-- ══ OPTION A: THREE.JS 3D GLOBE ══ -->
<div class="demo active" id="demo-a">
  <canvas id="globe-canvas"></canvas>
  <div class="badge">🌐 Three.js 3D Spinning Globe — Interactive (drag to rotate)</div>
</div>

<!-- ══ OPTION B: SVG FLAT MAP ══ -->
<div class="demo" id="demo-b" style="position:relative" id="map-b">
  <svg id="world-svg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;width:100%;height:100%">
    <rect width="1000" height="500" fill="#060e20"/>
    <!-- Simplified world map paths -->
    <!-- North America -->
    <path class="country active2" d="M95,80 L175,70 L220,85 L240,120 L230,155 L210,170 L190,165 L175,180 L165,200 L150,210 L135,195 L120,185 L105,160 L90,140 L85,115 Z"/>
    <!-- South America -->
    <path class="country" d="M165,225 L195,215 L210,230 L215,260 L210,300 L200,330 L185,350 L170,345 L158,320 L155,290 L158,265 L160,245 Z"/>
    <!-- Europe -->
    <path class="country" d="M440,80 L480,75 L500,85 L510,100 L500,115 L480,120 L465,115 L450,105 L440,95 Z"/>
    <!-- Africa -->
    <path class="country" d="M450,160 L490,155 L510,165 L515,190 L510,225 L500,255 L485,275 L465,280 L450,270 L440,245 L435,215 L438,185 L442,168 Z"/>
    <!-- Egypt/MENA (highlighted) -->
    <path class="country active" d="M500,145 L530,140 L545,150 L548,168 L540,178 L520,180 L505,175 L496,162 Z"/>
    <!-- Saudi/Gulf (highlighted) -->
    <path class="country active" d="M540,160 L575,155 L590,165 L592,185 L580,198 L560,200 L545,192 L538,178 Z"/>
    <!-- UAE/Gulf (highlighted) -->
    <path class="country active" d="M578,165 L600,160 L610,170 L608,183 L595,188 L580,185 Z"/>
    <!-- Asia -->
    <path class="country" d="M620,85 L720,75 L760,90 L780,115 L770,140 L740,155 L700,150 L670,140 L645,120 L625,105 Z"/>
    <!-- Australia -->
    <path class="country" d="M720,300 L780,290 L810,305 L815,340 L800,360 L770,365 L745,355 L728,335 L720,315 Z"/>
    <!-- Russia/Central Asia -->
    <path class="country" d="M500,60 L650,50 L720,65 L730,85 L700,95 L650,90 L600,88 L560,82 L520,75 Z"/>
    <!-- India -->
    <path class="country" d="M600,155 L630,150 L645,165 L640,195 L625,215 L608,218 L596,205 L592,183 L595,168 Z"/>
    <!-- North Africa -->
    <path class="country active2" d="M440,148 L498,142 L502,158 L495,162 L460,165 L443,160 Z"/>
  </svg>

  <!-- PIN: Egypt -->
  <div class="pin-wrap" id="pin-egypt" style="left:51%;top:47%">
    <div class="pin"><div class="pin-inner"></div></div>
    <div class="pin-pulse"></div>
    <div class="pin-pulse pin-pulse2"></div>
    <div class="pin-label">🇪🇬 Egypt — HQ</div>
  </div>

  <!-- PIN: Saudi -->
  <div class="pin-wrap" id="pin-ksa" style="left:57%;top:49%" >
    <div class="pin" style="background:linear-gradient(135deg,#00D4FF,#00AEEF)"><div class="pin-inner"></div></div>
    <div class="pin-pulse"></div>
    <div class="pin-label">🇸🇦 Saudi Arabia</div>
  </div>

  <!-- PIN: UAE -->
  <div class="pin-wrap" id="pin-uae" style="left:61%;top:47%">
    <div class="pin" style="background:linear-gradient(135deg,#7C3AED,#00AEEF)"><div class="pin-inner"></div></div>
    <div class="pin-pulse"></div>
    <div class="pin-label">🇦🇪 UAE</div>
  </div>

  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#00AEEF"></div>Active Offices</div>
    <div class="leg-item"><div class="leg-dot" style="background:#1a6fa0"></div>Served Regions</div>
  </div>
  <div class="badge">🗺️ SVG Interactive Map — Countries Highlighted</div>
</div>

<!-- ══ OPTION C: DOT GLOBE ══ -->
<div class="demo" id="demo-c">
  <canvas id="dot-canvas"></canvas>
  <div class="badge">✨ Canvas Dot Globe — خفيف وسريع</div>
</div>


<script>
// ══════════════════════════════════
// OPTION A: THREE.JS 3D GLOBE
// ══════════════════════════════════
(function() {
  const canvas = document.getElementById('globe-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });

  function setSize() {
    const c = document.getElementById('demo-a');
    renderer.setSize(c.clientWidth, c.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    camera.aspect = c.clientWidth / c.clientHeight;
    camera.updateProjectionMatrix();
  }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  camera.position.set(0, 0, 3.5);
  setSize();

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.3));
  const dLight = new THREE.DirectionalLight(0x00AEEF, 1.2);
  dLight.position.set(5, 3, 5);
  scene.add(dLight);
  const bLight = new THREE.DirectionalLight(0x7C3AED, 0.6);
  bLight.position.set(-5, -3, -5);
  scene.add(bLight);

  // Globe base
  const globeGeo = new THREE.SphereGeometry(1, 64, 64);
  const globeMat = new THREE.MeshPhongMaterial({
    color: 0x0a1628,
    emissive: 0x050d1a,
    specular: 0x00AEEF,
    shininess: 20,
    transparent: true,
    opacity: 0.95,
  });
  const globe = new THREE.Mesh(globeGeo, globeMat);
  scene.add(globe);

  // Grid lines on globe
  const wireGeo = new THREE.SphereGeometry(1.001, 24, 24);
  const wireMat = new THREE.MeshBasicMaterial({ color: 0x00AEEF, wireframe: true, transparent: true, opacity: 0.06 });
  scene.add(new THREE.Mesh(wireGeo, wireMat));

  // Atmosphere glow
  const atmGeo = new THREE.SphereGeometry(1.08, 32, 32);
  const atmMat = new THREE.MeshBasicMaterial({ color: 0x00AEEF, transparent: true, opacity: 0.06, side: THREE.BackSide });
  scene.add(new THREE.Mesh(atmGeo, atmMat));

  // Outer ring
  const ringGeo = new THREE.TorusGeometry(1.25, 0.008, 8, 120);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x00AEEF, transparent: true, opacity: 0.25 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2.5;
  scene.add(ring);

  // Convert lat/lon to 3D
  function ll2xyz(lat, lon, r=1.05) {
    const phi = (90 - lat) * Math.PI / 180;
    const theta = (lon + 180) * Math.PI / 180;
    return new THREE.Vector3(
      -r * Math.sin(phi) * Math.cos(theta),
       r * Math.cos(phi),
       r * Math.sin(phi) * Math.sin(theta)
    );
  }

  // Locations
  const locations = [
    { lat: 30.0, lon: 31.2, label: '🇪🇬 Egypt', color: 0x00AEEF, size: 0.035 },
    { lat: 24.7, lon: 46.7, label: '🇸🇦 Saudi', color: 0x00AEEF, size: 0.028 },
    { lat: 25.2, lon: 55.3, label: '🇦🇪 UAE',   color: 0x7C3AED, size: 0.025 },
    { lat: 29.3, lon: 47.7, label: '🇰🇼 Kuwait', color: 0x00D4FF, size: 0.022 },
    { lat: 51.5, lon: -0.1, label: '🇬🇧 London', color: 0xffffff, size: 0.018 },
    { lat: 40.7, lon: -74.0, label: '🇺🇸 NYC',   color: 0xffffff, size: 0.018 },
  ];

  const pinGroup = new THREE.Group();
  scene.add(pinGroup);

  locations.forEach(loc => {
    const pos = ll2xyz(loc.lat, loc.lon);

    // Dot
    const dg = new THREE.SphereGeometry(loc.size, 12, 12);
    const dm = new THREE.MeshBasicMaterial({ color: loc.color });
    const dot = new THREE.Mesh(dg, dm);
    dot.position.copy(pos);
    pinGroup.add(dot);

    // Pulse ring
    const rg = new THREE.TorusGeometry(loc.size*2, 0.003, 6, 32);
    const rm = new THREE.MeshBasicMaterial({ color: loc.color, transparent: true, opacity: 0.5 });
    const pring = new THREE.Mesh(rg, rm);
    pring.position.copy(pos);
    pring.lookAt(0, 0, 0);
    pinGroup.add(pring);

    // Animate pulse
    gsap.to(pring.scale, { x: 4, y: 4, z: 4, duration: 2, repeat: -1, yoyo: false, ease: 'power1.out',
      onUpdate: () => { pring.material.opacity = 0.5 * (1 - pring.scale.x/4); }
    });
  });

  // Arc connections (Egypt to others)
  function makeArc(from, to, color=0x00AEEF) {
    const p1 = ll2xyz(from.lat, from.lon, 1.05);
    const p2 = ll2xyz(to.lat, to.lon, 1.05);
    const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
    mid.normalize().multiplyScalar(1.5);
    const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
    const points = curve.getPoints(50);
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.4 });
    return new THREE.Line(geo, mat);
  }

  const egypt = locations[0];
  [locations[1], locations[2], locations[3], locations[4], locations[5]].forEach(loc => {
    scene.add(makeArc(egypt, loc, loc.color));
  });

  // Mouse drag to rotate
  let isDragging = false, prevX = 0, prevY = 0;
  let rotX = 0, rotY = 0;
  canvas.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
  window.addEventListener('mouseup', () => isDragging = false);
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    rotY += (e.clientX - prevX) * 0.005;
    rotX += (e.clientY - prevY) * 0.005;
    prevX = e.clientX; prevY = e.clientY;
  });

  let autoRot = 0;
  function animateGlobe() {
    requestAnimationFrame(animateGlobe);
    if (!isDragging) autoRot += 0.003;
    globe.rotation.y = autoRot + rotY;
    globe.rotation.x = rotX * 0.4;
    pinGroup.rotation.y = autoRot + rotY;
    pinGroup.rotation.x = rotX * 0.4;
    ring.rotation.z += 0.005;
    renderer.render(scene, camera);
  }
  animateGlobe();
  window.addEventListener('resize', setSize);
})();


// ══════════════════════════════════
// OPTION C: DOT GLOBE (Canvas 2D)
// ══════════════════════════════════
(function() {
  const canvas = document.getElementById('dot-canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    const el = document.getElementById('demo-c');
    canvas.width = el.clientWidth;
    canvas.height = el.clientHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Generate globe dots
  const dots = [];
  for (let lat = -80; lat <= 80; lat += 6) {
    const r = Math.cos(lat * Math.PI / 180);
    const count = Math.max(1, Math.round(r * 30));
    for (let i = 0; i < count; i++) {
      const lon = (i / count) * 360 - 180;
      dots.push({ lat, lon, size: 1.5, color: 'rgba(0,174,239,0.4)' });
    }
  }

  // Special dots for MENA
  const mena = [
    {lat:30,lon:31,color:'#00AEEF',size:4,label:'Egypt'},
    {lat:24.7,lon:46.7,color:'#00AEEF',size:3.5,label:'Saudi'},
    {lat:25.2,lon:55.3,color:'#7C3AED',size:3,label:'UAE'},
    {lat:29.3,lon:47.7,color:'#00D4FF',size:3,label:'Kuwait'},
  ];

  let angle = 0;
  let pulse = 0;

  function ll2screen(lat, lon, cx, cy, radius) {
    const a = (lon + angle * 180/Math.PI) * Math.PI / 180;
    const x = cx + radius * Math.cos(lat * Math.PI/180) * Math.sin(a);
    const z = Math.cos(lat * Math.PI/180) * Math.cos(a);
    const y = cy - radius * Math.sin(lat * Math.PI/180);
    return { x, y, z };
  }

  function drawDotGlobe() {
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2;
    const radius = Math.min(W, H) * 0.38;

    ctx.clearRect(0, 0, W, H);

    // Dark bg
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius*1.2);
    grad.addColorStop(0, 'rgba(10,22,40,0.8)');
    grad.addColorStop(1, 'rgba(5,13,26,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, radius*1.3, 0, Math.PI*2);
    ctx.fill();

    // Draw globe dots (back to front)
    const visible = dots.map(d => ({ ...d, ...ll2screen(d.lat, d.lon, cx, cy, radius) }))
                        .filter(d => d.z > 0)
                        .sort((a,b) => a.z - b.z);

    visible.forEach(d => {
      const alpha = 0.15 + d.z * 0.4;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.size, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,174,239,${alpha})`;
      ctx.fill();
    });

    // MENA pins
    mena.forEach(m => {
      const pos = ll2screen(m.lat, m.lon, cx, cy, radius);
      if (pos.z <= 0) return;

      // Pulse ring
      const pr = 8 + (Math.sin(pulse + m.lon/20) + 1) * 10;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, pr, 0, Math.PI*2);
      ctx.strokeStyle = m.color + '60';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Dot
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, m.size * 1.5, 0, Math.PI*2);
      ctx.fillStyle = m.color;
      ctx.fill();
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Label
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.font = 'bold 11px Outfit,sans-serif';
      ctx.fillText(m.label, pos.x + 10, pos.y + 4);
    });

    // Outer glow
    const glow = ctx.createRadialGradient(cx, cy, radius*0.9, cx, cy, radius*1.1);
    glow.addColorStop(0, 'rgba(0,174,239,0)');
    glow.addColorStop(0.5, 'rgba(0,174,239,0.06)');
    glow.addColorStop(1, 'rgba(0,174,239,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, radius*1.1, 0, Math.PI*2);
    ctx.fillStyle = glow;
    ctx.fill();

    angle += 0.007;
    pulse += 0.05;
    requestAnimationFrame(drawDotGlobe);
  }
  drawDotGlobe();
})();


// ══════════════════════════════════
// TAB SWITCHER
// ══════════════════════════════════
function showTab(id, btn) {
  document.querySelectorAll('.demo').forEach(d => d.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('demo-'+id).classList.add('active');
  btn.classList.add('active');
}
</script>
</body>
</html>
